# ---------------------------------------------------------------------------
# Render blueprint for the MediClaim / ClaimGen AI backend.
#   Dashboard -> New -> Blueprint -> point it at this repository.
# The service is created with rootDir=backend, so paths in config.py resolve
# exactly as they do on your machine.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: mediclaim-api
    runtime: python
    plan: free
    rootDir: backend
    pythonVersion: "3.12"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/live
    autoDeploy: true
    envVars:
      # --- required -------------------------------------------------------
      # Add your Hugging Face token manually in the Render dashboard (it is a
      # secret and must never be committed). Create one, free:
      #   https://huggingface.co/settings/tokens   -> "Fine-grained", Read access
      # Leave it unset to run deterministically with no AI calls at all.
      - key: HF_TOKEN
        sync: false
      # --- provider selection ---------------------------------------------
      #   huggingface (default) | gemini | offline
      - key: AI_PROVIDER
        value: huggingface
      # --- model selection ------------------------------------------------
      # Any model served by HF Inference Providers. Change these and redeploy
      # if GET /api/health reports the model is unavailable.
      - key: HF_MODEL_EXTRACTION
        value: Qwen/Qwen2.5-72B-Instruct
      - key: HF_MODEL_REASONING
        value: Qwen/Qwen2.5-72B-Instruct
      - key: HF_MODEL_REVIEW
        value: Qwen/Qwen2.5-72B-Instruct
      # --- optional: Google Gemini as an alternative -----------------------
      # Only used when AI_PROVIDER=gemini. Leave the key unset otherwise.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_EXTRACTION
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_REASONING
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_REVIEW
        value: gemini-3.8-flash
      # --- CORS -----------------------------------------------------------
      # Comma separated browser origins. The value must match what the browser
      # sends EXACTLY - no trailing slash, or the preflight will be rejected.
      # Replace the Vercel URL after you deploy the frontend.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174,https://mediclaim-nine.vercel.app
      # --- app ------------------------------------------------------------
      - key: APP_NAME
        value: ClaimGen AI
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_DOCUMENTS_PER_CLAIM
        value: "10"
      # --- storage --------------------------------------------------------
      # The free tier's filesystem is ephemeral: uploaded documents and saved
      # claims disappear on redeploy or restart. Set PERSIST_CLAIMS=false to
      # keep the service stateless, or attach a disk / use object storage.
      - key: PERSIST_CLAIMS
        value: "true"
      - key: FORCE_OFFLINE
        value: "0"
